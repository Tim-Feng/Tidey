name: Tests

on:
  push:
    branches: [master, ci-test]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  python-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: api/library/python/iterm2
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        working-directory: api/library/python/iterm2
        run: python -m pytest tests/ -v

      - name: Run mypy
        working-directory: api/library/python/iterm2
        run: python -m mypy iterm2/

  xcode-tests:
    runs-on: macos-15
    # Must exceed all prior steps plus the Run tests step timeout by enough
    # margin (>=10 minutes) for xcresult finalize and artifact upload.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select dependency-compatible Xcode
        run: |
          required_xcode_version="$(cat last-xcode-version)"
          current_xcode_version="$(xcodebuild -version)"
          if [ "$current_xcode_version" != "$required_xcode_version" ]; then
            required_xcode_short_version="$(awk 'NR == 1 { print $2 }' last-xcode-version)"
            required_developer_dir="/Applications/Xcode_${required_xcode_short_version}.app/Contents/Developer"
            if [ ! -d "$required_developer_dir" ]; then
              echo "::error::Required Xcode not found: $required_developer_dir"
              echo "Required version:"
              printf '%s\n' "$required_xcode_version"
              echo "Current version:"
              printf '%s\n' "$current_xcode_version"
              ls -d /Applications/Xcode*.app 2>/dev/null || true
              exit 1
            fi
            sudo xcode-select -s "$required_developer_dir"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Kill orphan Xcode processes
        run: |
          killall ibtoold 2>/dev/null || true
          killall AssetCatalogSimulatorAgent 2>/dev/null || true

      - name: Run tests
        timeout-minutes: 30
        run: |
          set -o pipefail

          test_count_from_result() {
            local xcresult_path=$1
            if [ ! -d "$xcresult_path" ]; then
              echo 0
              return
            fi

            xcrun xcresulttool get test-results summary --path "$xcresult_path" 2>/dev/null \
              | python3 -c 'import json, sys; print(int(json.load(sys.stdin).get("totalTestCount") or 0))' 2>/dev/null \
              || echo 0
          }

          # Retry is reserved for proven-nondeterministic build infrastructure
          # failures (asset compiler / ibtoold crashes) that occur before any
          # test runs. Test host preparation timeouts, per-test timeouts,
          # assertion failures, and crashes fail immediately: same-phase
          # same-signature timeouts are deterministic bugs (see
          # docs/debug-lessons.md), and retrying them only hides regressions.
          for attempt in 1 2; do
            echo "::group::Attempt $attempt of 2"
            xcresult="TestResults-attempt-${attempt}.xcresult"
            build_log="build-output-attempt-${attempt}.txt"

            # Run xcodebuild and capture output without losing xcodebuild's status to tee.
            set +e
            TEST_RUNNER_TIDEY_SKIP_CI_HANGING_TESTS=1 \
            xcodebuild test \
              -project iTerm2.xcodeproj \
              -scheme ModernTests \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 \
              -maximum-test-execution-time-allowance 600 \
              -resultBundlePath "$xcresult" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$build_log"
            exit_code=$?
            set -e
            test_count="$(test_count_from_result "$xcresult")"
            echo "ModernTests executed $test_count tests on attempt $attempt"
            echo "::endgroup::"

            if [ $exit_code -eq 0 ]; then
              if [ "$test_count" -le 0 ]; then
                echo "::error::ModernTests reported success but executed 0 tests"
                exit 1
              fi
              echo "Tests passed on attempt $attempt ($test_count tests)"
              exit 0
            fi

            # Retry only when the failure is a known asset compiler / ibtoold
            # crash AND no test ever ran. Anything after the first executed
            # test method is a real failure with diagnostics worth keeping.
            if [ "$test_count" -eq 0 ] &&
               grep -q "CompileAssetCatalogVariant failed\|IBPlatformToolFailureException\|The tool closed the connection" "$build_log"; then
              echo "::warning::Attempt $attempt failed due to a known asset compiler/ibtoold failure before any test ran"
              if [ $attempt -lt 2 ]; then
                echo "Retrying..."
                killall ibtoold 2>/dev/null || true
                killall AssetCatalogSimulatorAgent 2>/dev/null || true
                killall "Tidey Dev" 2>/dev/null || true
                sleep 5
                continue
              else
                echo "::error::Both attempts failed due to asset compiler/ibtoold failures"
                exit 1
              fi
            else
              echo "::error::Tests failed (diagnostics preserved in $xcresult and $build_log)"
              exit 1
            fi
          done

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.run_id }}-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: |
            TestResults-attempt-*.xcresult
            build-output-attempt-*.txt
          if-no-files-found: warn
          retention-days: 7
