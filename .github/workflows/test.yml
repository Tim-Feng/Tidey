name: Tests

on:
  push:
    branches: [master, ci-test]
  pull_request:
    branches: [master]

jobs:
  python-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: api/library/python/iterm2
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        working-directory: api/library/python/iterm2
        run: python -m pytest tests/ -v

      - name: Run mypy
        working-directory: api/library/python/iterm2
        run: python -m mypy iterm2/

  xcode-tests:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select dependency-compatible Xcode
        run: |
          required_xcode_version="$(cat last-xcode-version)"
          current_xcode_version="$(xcodebuild -version)"
          if [ "$current_xcode_version" != "$required_xcode_version" ]; then
            required_xcode_short_version="$(awk 'NR == 1 { print $2 }' last-xcode-version)"
            required_developer_dir="/Applications/Xcode_${required_xcode_short_version}.app/Contents/Developer"
            if [ ! -d "$required_developer_dir" ]; then
              echo "::error::Required Xcode not found: $required_developer_dir"
              echo "Required version:"
              printf '%s\n' "$required_xcode_version"
              echo "Current version:"
              printf '%s\n' "$current_xcode_version"
              ls -d /Applications/Xcode*.app 2>/dev/null || true
              exit 1
            fi
            sudo xcode-select -s "$required_developer_dir"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Kill orphan Xcode processes
        run: |
          killall ibtoold 2>/dev/null || true
          killall AssetCatalogSimulatorAgent 2>/dev/null || true

      - name: Run tests
        run: |
          set -o pipefail

          test_count_from_result() {
            if [ ! -d TestResults.xcresult ]; then
              echo 0
              return
            fi

            xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>/dev/null \
              | python3 -c 'import json, sys; print(int(json.load(sys.stdin).get("totalTestCount") or 0))' 2>/dev/null \
              || echo 0
          }

          # Retry up to 3 times, but only for known Xcode infrastructure failures.
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            rm -rf TestResults.xcresult build_output.txt

            # Run xcodebuild and capture output without losing xcodebuild's status to tee.
            set +e
            xcodebuild test \
              -project iTerm2.xcodeproj \
              -scheme ModernTests \
              -parallel-testing-enabled NO \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_output.txt
            exit_code=$?
            set -e
            test_count="$(test_count_from_result)"
            echo "ModernTests executed $test_count tests on attempt $attempt"
            echo "::endgroup::"

            if [ $exit_code -eq 0 ]; then
              if [ "$test_count" -le 0 ]; then
                echo "::error::ModernTests reported success but executed 0 tests"
                exit 1
              fi
              echo "Tests passed on attempt $attempt ($test_count tests)"
              exit 0
            fi

            # Xcode may fail before tests start because ibtoold crashes or the test host times out.
            if grep -q "CompileAssetCatalogVariant failed\|IBPlatformToolFailureException\|The tool closed the connection\|The test runner timed out while preparing to run tests" build_output.txt; then
              echo "::warning::Attempt $attempt failed due to a known Xcode infrastructure failure"
              if [ $attempt -lt 3 ]; then
                echo "Retrying..."
                killall ibtoold 2>/dev/null || true
                killall AssetCatalogSimulatorAgent 2>/dev/null || true
                killall "Tidey Dev" 2>/dev/null || true
                sleep 5
                continue
              else
                echo "::error::All 3 attempts failed due to Xcode infrastructure failures"
                exit 1
              fi
            else
              # Real test failure - don't retry
              echo "::error::Tests failed (not a recognized Xcode infrastructure issue)"
              exit 1
            fi
          done

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
